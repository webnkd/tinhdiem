<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Điểm - THM</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./main.js"></script>
  </head>
  <body>
      <div class="table-container">
      <h3>Nhập điểm</h3>
    
      <table class="data-table">
          <thead>
              <tr>
                  <th style="width: 30%;">Môn</th>
                  <th style="width: 35%;">Điểm 12</th>
                  <th style="width: 35%;">Điểm thi</th>
              </tr>
          </thead>
          <tbody id="table-body">
              <tr>
                  <td>Toán</td>
                  <td><input type="number" class="table-input" id="toan12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="toan" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Lý</td>
                  <td><input type="number" class="table-input" id="ly12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="ly" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Hoá</td>
                  <td><input type="number" class="table-input" id="hoa12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="hoa" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Ngữ văn</td>
                  <td><input type="number" class="table-input" id="van12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="van" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Sinh học</td>

                  <td><input type="number" class="table-input" id="sinh" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Lịch sử</td>
                  <td><input type="number" class="table-input" id="su12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="su" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Địa lý</td>
                  <td><input type="number" class="table-input" id="dia12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="dia" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Tiếng anh</td>
                  <td><input type="number" class="table-input" id="anh12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="anh" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Tin học</td>
                  <td><input type="number" class="table-input" id="tin12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="tin" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>KTPL</td>
                  <td><input type="number" class="table-input" id="ktpl12" value="0" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="ktpl" value="0" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>CNCN</td>
                  <td><input type="number" class="table-input" id="cncn12" value="0" onchange="kiemTraPopup(this)" ></td>
                  <td><input type="number" class="table-input" id="cncn" value="0" onchange="kiemTraPopup(this)" ></td>
              </tr>
              <tr>
                  <td>CNNN</td>
                  <td><input type="number" class="table-input" id="cnnn12" value="0" onchange="kiemTraPopup(this)" ></td>
                  <td><input type="number" class="table-input" id="cnnn" value="0" onchange="kiemTraPopup(this)" ></td>
              </tr>
          </tbody>
      </table>
    
      <div class="dgnl">
        <label style="width: 70%;">Điểm thi đánh giá năng lực: </label><input type="number" style="width: 30%;" class="table-input" id="dgnl" value="0" min="0" max="1200" step="1" >
      </div>
      <div class="table-btn-tinh">
        <button class="btn btn-tinh" onclick="tinhDiem(this)">Tính điểm</button>
      </div>
      
      
      <!-- Hiểm thị điểm  -->
      <table class="data-table">
        <thead>
            <tr>
                <th >Ngành</th>
                <th >XT1</th>
                <th >XT2</th>
                <th >XT3</th>
                <th >XT4</th>
                <th >TV</th>
            </tr>
        </thead>
          <tbody id="table-body">
            <tr>
                <td>QTKD</td>
                <td><label id="qtkd_dxt1"></label></td>
                <td><label id="qtkd_dxt2"></label></td>
                <td><label id="qtkd_dxt3"></label></td>
                <td><label id="qtkd_dxt4"></label></td>

                <td><label id="kt_dxt3"></label></td>
                <td><label id="kt_dxt4"></label></td>
                <td><label id="kt_dtv"></label></td>
            </tr>
            <tr>
                <td>CNTT</td>
                <td><label id="tin_dxt1"></label></td>
                <td><label id="tin_dxt2"></label></td>
                <td><label id="tin_dxt3"></label></td>
                <td><label id="tin_dxt4"></label></td>
                <td><label id="tin_dtv"></label></td>
            </tr>
            <tr>
                <td>COKHI</td>
                <td><label id="ck_dxt1"></label></td>
                <td><label id="ck_dxt2"></label></td>
                <td><label id="ck_dxt3"></label></td>
                <td><label id="ck_dxt4"></label></td>
                <td><label id="ck_dtv"></label></td>
            </tr>
            <tr>
                <td>OTO</td>
                <td><label id="oto_dxt1"></label></td>
                <td><label id="oto_dxt2"></label></td>
                <td><label id="oto_dxt3"></label></td>
                <td><label id="oto_dxt4"></label></td>
                <td><label id="oto_dtv"></label></td>
            </tr>
            <tr>
                <td>DIEN</td>
                <td><label id="dien_dxt1"></label></td>
                <td><label id="dien_dxt2"></label></td>
                <td><label id="dien_dxt3"></label></td>
                <td><label id="dien_dxt4"></label></td>
                <td><label id="dien_dtv"></label></td>
