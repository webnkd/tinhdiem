<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính Điểm</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- <script src="./main.js"></script> -->
  </head>
  <body>
      <div class="table-container" style="margin-top: 0;">
      <table class="data-table">
          <thead>
              <tr>
                  <th style="width: 30%;">Môn</th>
                  <th style="width: 35%;">Điểm 12</th>
                  <th style="width: 35%;">Điểm thi</th>
              </tr>
          </thead>
          <tbody id="table-body">
              <tr>
                  <td>Toán</td>
                  <td><input type="number" class="table-input" id="toan12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="toan" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Lý</td>
                  <td><input type="number" class="table-input" id="ly12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="ly" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Hoá</td>
                  <td><input type="number" class="table-input" id="hoa12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="hoa" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Ngữ văn</td>
                  <td><input type="number" class="table-input" id="van12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="van" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Sinh học</td>
                  <td><input type="number" class="table-input" id="sinh12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="sinh" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Lịch sử</td>
                  <td><input type="number" class="table-input" id="su12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="su" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Địa lý</td>
                  <td><input type="number" class="table-input" id="dia12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="dia" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Tiếng anh</td>
                  <td><input type="number" class="table-input" id="anh12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="anh" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>Tin học</td>
                  <td><input type="number" class="table-input" id="tin12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="tin" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>KTPL</td>
                  <td><input type="number" class="table-input" id="ktpl12" onchange="kiemTraPopup(this)"></td>
                  <td><input type="number" class="table-input" id="ktpl" onchange="kiemTraPopup(this)"></td>
              </tr>
              <tr>
                  <td>CNCN</td>
                  <td><input type="number" class="table-input" id="cncn12" onchange="kiemTraPopup(this)" ></td>
                  <td><input type="number" class="table-input" id="cncn" onchange="kiemTraPopup(this)" ></td>
              </tr>
              <tr>
                  <td>CNNN</td>
                  <td><input type="number" class="table-input" id="cnnn12" onchange="kiemTraPopup(this)" ></td>
                  <td><input type="number" class="table-input" id="cnnn" onchange="kiemTraPopup(this)" ></td>
              </tr>
          </tbody>
      </table>
    
      <div class="dgnl">
        <label style="width: 70%;">Điểm thi đánh giá năng lực: </label><input type="number" style="width: 30%;" class="table-input" id="dgnl" min="0" max="1200" step="1" >
     </div>
      <div>
       <label>Tốt nghiệp trước 2026 &nbsp;&nbsp; </label>
        <input type="checkbox" id="namtn" value="2026"> 
      </div>
      <div class="table-btn">
        <button class="btn btn-tinh" onclick="tinhDiem(this)">Tính điểm dự kiến</button>
        <button class="btn btn-clean" onclick="lamLai(this)">Nhập mới</button>
      </div>
      
      <!-- Hiểm thị điểm  -->
      <table class="data-table">
        <thead>
            <tr>
                <th >Ngành</th>
                <th >Đ1</th>
                <th >Đ2</th>
                <th >Đ3</th>
                <th >Đ4</th>
                <th >TV</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td>QT, KT</td>
                <td><label id="nhom1_dxt1"></label></td>
                <td><label id="nhom1_dxt2"></label></td>
                <td><label id="nhom1_dxt3"></label></td>
                <td><label id="nhom1_dxt4"></label></td>
                <td><label id="nhom1_dtv"></label></td>
            </tr>
            
            <tr>
                <td>CNTT</td>
                <td><label id="nhom2_dxt1"></label></td>
                <td><label id="nhom2_dxt2"></label></td>
                <td><label id="nhom2_dxt3"></label></td>
                <td><label id="nhom2_dxt4"></label></td>
                <td><label id="nhom2_dtv"></label></td>
            </tr>
            <tr>
                <td>CK, OT, DI</td>
                <td><label id="nhom3_dxt1"></label></td>
                <td><label id="nhom3_dxt2"></label></td>
                <td><label id="nhom3_dxt3"></label></td>
                <td><label id="nhom3_dxt4"></label></td>
                <td><label id="nhom3_dtv"></label></td>
            </tr>

        </tbody>
      </table>
      <div class="ketqua">
        <!-- <p>QT, KT: <span id="thm_nhom1"></span></p>
        <p>CNTT: <span id="thm_nhom2"></span></p>
        <p>CK, OTO, DI: <span id="thm_nhom3"></span></p> -->

        <table class="data-table">
        <tbody id="table-body">
            <tr>
                <td>QT, KT</td>
                <td><label id="thm_nhom1"></label></td>
            </tr>
            
            <tr>
                <td>CNTT</td>
                <td><label id="thm_nhom2"></label></td>
            </tr>
            <tr>
                <td>CK, OT, DI</td>
                <td><label id="thm_nhom3"></label></td>
            </tr>

        </tbody>
      </table>

      </div>
    </div>
    
    <script src="./main.js"></script>
  </body>
</html>
